# Dehnen & Binney (1998, MNRAS 294, 429; arXiv:astro-ph/9612059) Model 1, the host used by
# Ibata+2019 for Fimbulthul. Units Msun, kpc. R0 = 8 kpc, R_d,* = 0.25 R0 = 2 kpc.
# Parameters: DB98 Tables 1 (disk scale heights, Rd ratios, R_m) and 3 (Sigma_d,tot = 1905 Msun/pc^2,
# rho0_b = 0.4271, rho0_h = 0.7110 Msun/pc^3, gamma_h = -2, beta_h = 2.959, r0_h = 3.83 kpc, r_t,h = inf).
# Disc split (0.70 thin, 0.05 thick, 0.25 ISM of Sigma(R0)) as in AGAMA's BT08.ini, which equals this
# model except for its scale heights (BT08: thin 0.30, ISM 0.08 kpc; DB98: 0.18, 0.04 kpc).
# Vertical profiles exponential (DB98 eq. 1). The halo is given an outer cutoff at 1000 kpc
# (numerical; irrelevant inside 100 kpc).

[Potential thick]
type = Disk
surfaceDensity = 1.182e8
scaleRadius = 2.
scaleHeight = 1.0

[Potential thin]
type = Disk
surfaceDensity = 1.655e9
scaleRadius = 2.
scaleHeight = 0.18

[Potential ISM]
type = Disk
surfaceDensity = 1.32e8
scaleRadius = 4.
scaleHeight = 0.04
innerCutoffRadius = 4.0

[Potential halo]
type = Spheroid
densityNorm = 7.110e8
axisRatioZ = 0.8
gamma = -2
beta = 2.959
scaleRadius = 3.83
outerCutoffRadius = 1000

[Potential bulge]
type = Spheroid
densityNorm = 4.271e8
axisRatioZ = 0.6
gamma = 1.8
beta = 1.8
scaleRadius = 1
outerCutoffRadius = 1.9
